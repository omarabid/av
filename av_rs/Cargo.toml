[package]
name = "av_rs"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.5.4", features = ["derive"] }
log = "0.4.21"
env_logger = "0.11.3"
reqwest = { version = "0.12.4", features = ["json"] }
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.117"
tokio = { version = "1.37.0", features = ["full"] }
anyhow = "1.0.86"
git2 = "0.18.3"
shellexpand = "3.1.0"
figment = { version = "0.10.10", features = ["toml", "yaml", "json", "env"] } # Updated to 0.10.10 as 0.10 might be too broad
xdg = "2.5.2" # Updated to 2.5.2
once_cell = "1.19.0" # Using a specific recent version
